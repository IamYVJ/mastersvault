name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The content is in a private repository, and pull requests from forks can't read the key for it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - name: Fetch content
        uses: actions/checkout@v5
        with:
          repository: IamYVJ/mastersvault-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Check answer keys
        run: npm run verify
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run check
      # The test data files are masked with this key, and it becomes part of their names.
      - name: Pick a new key for the test data
        run: echo "DATA_KEY=$(openssl rand -hex 6)" >> "$GITHUB_ENV"
      - name: Build site
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
